# Tells the Secrets Store CSI driver which Key Vault secrets to fetch and how
# to authenticate. clientID = the workload identity (via the ServiceAccount
# token exchange), so no password or client secret appears anywhere here.
#
# There is deliberately NO secretObjects block. The earlier design used one,
# which silently syncs the values into a Kubernetes Secret object. Here the
# values only ever exist as files in a tmpfs mount inside each pod.
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: koalatech-keyvault
  namespace: production
spec:
  provider: azure
  parameters:
    usePodIdentity: "false"
    clientID: "2acb228b-67dd-4f8a-9021-01ef1ab89a3a"
    keyvaultName: "jas220kvhd01"
    tenantId: "2625129d-99a2-4df5-988e-5c5d07e7d0fb"
    objects: |
      array:
        - |
          objectName: postgres-user
          objectType: secret
        - |
          objectName: postgres-password
          objectType: secret
        - |
          objectName: jwt-secret-key
          objectType: secret
        - |
          objectName: default-admin-password
          objectType: secret
        - |
          objectName: storage-connection-string
          objectType: secret
