apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: user-db-pvc
  namespace: production
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: user-db
  namespace: production
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: user-db
  template:
    metadata:
      labels:
        app: user-db
        azure.workload.identity/use: "true"
    spec:
      serviceAccountName: koalatech-sa
      containers:
        - name: user-db
          image: postgres:16-alpine
          ports:
            - containerPort: 5432
          env:
            # The official postgres image reads *_FILE variables natively,
            # so the credentials come straight from the Key Vault mount.
            - name: POSTGRES_USER_FILE
              value: /mnt/secrets-store/postgres-user
            - name: POSTGRES_PASSWORD_FILE
              value: /mnt/secrets-store/postgres-password
            - name: POSTGRES_DB
              value: users
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          readinessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U \"$(cat /mnt/secrets-store/postgres-user)\" -d users"]
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 512Mi
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: secrets-store
              mountPath: /mnt/secrets-store
              readOnly: true
      volumes:
        - name: secrets-store
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: koalatech-keyvault
        - name: data
          persistentVolumeClaim:
            claimName: user-db-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: user-db
  namespace: production
spec:
  selector:
    app: user-db
  ports:
    - port: 5432
      targetPort: 5432
