# The ONLY identity the KoalaTech pods run as. Azure AD trusts this exact
# namespace/name pair through the federated identity credential that
# Terraform created (subject system:serviceaccount:production:koalatech-sa).
# The client-id below is an identifier, not a secret, so it is safe in Git.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: koalatech-sa
  namespace: production
  annotations:
    azure.workload.identity/client-id: "2acb228b-67dd-4f8a-9021-01ef1ab89a3a"
